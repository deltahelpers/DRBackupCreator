name: build

on:
  push:
    branches: [master, dotnet]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the installers (e.g. 2.2.0)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Build, test and package
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = ""
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          elseif ("${{ github.event.inputs.version }}") {
            $version = "${{ github.event.inputs.version }}"
          }
          else {
            $project = Get-Content dotnet/DRBackupCreator.csproj -Raw
            $m = [regex]::Match($project, '<Version>([^<]+)</Version>')
            if ($m.Success) { $version = $m.Groups[1].Value }
          }
          if (-not $version) { throw "Could not work out the version. Pass one to the workflow." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\bin\drbc.exe, build\bin\drbc.exe.config, README.md, LICENSE `
            -DestinationPath "dist\DRBackupCreator-${{ steps.version.outputs.version }}-win32.zip" -Force

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

      - name: EXE installer (Inno Setup)
        shell: pwsh
        run: ./installer/build-installer.ps1 -NoBuild -Version ${{ steps.version.outputs.version }}

      - name: MSI installer (WiX)
        shell: pwsh
        run: ./installer/build-msi.ps1 -NoBuild -Version ${{ steps.version.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drbc-windows
          path: |
            dist/drbcWindowsInstaller.exe
            dist/drbcWindowsInstaller.msi
            dist/DRBackupCreator-*-win32.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: drbc-windows
          path: dist

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          name: DRBackupCreator ${{ github.ref_name }}
          files: |
            dist/drbcWindowsInstaller.exe
            dist/drbcWindowsInstaller.msi
            dist/DRBackupCreator-*-win32.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
